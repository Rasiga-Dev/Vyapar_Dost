<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vyapar Dost AI</title>
<style>

</style></head><body><div class="app"><header class="header"><h1>🤝 Vyapar Dost</h1><p id="tagline">Your AI Business Assistant</p></header><main class="content"><section class="card"><select id="language" class="language" aria-label="Choose language"><option value="en">English</option><option value="hi">हिन्दी</option><option value="ta">தமிழ்</option><option value="ml">മലയാളം</option><option value="te">తెలుగు</option><option value="kn">ಕನ್ನಡ</option><option value="bn">বাংলা</option><option value="mr">मराठी</option><option value="gu">ગુજરાતી</option><option value="pa">ਪੰਜਾਬੀ</option><option value="ur">اردو</option><option value="or">ଓଡ଼ିଆ</option><option value="as">অসমীয়া</option></select><p><label><input type="checkbox" id="speakReplies"> 🔊 Read AI answers aloud</label></p></section><section class="card"><div class="buttons"><button class="business-button" id="profitButton" type="button">📊 Profit / Loss</button><button class="business-button" id="ideaButton" type="button">💡 Business Ideas</button><button class="business-button" id="salesButton" type="button">📈 Sales Analysis</button><button class="business-button" id="stockButton" type="button">📦 Stock Help</button></div></section><section class="card calculator" id="calculator"><h2 id="calculatorTitle">🧮 Business Calculator</h2><label class="calc-label" id="revenueLabel" for="revenue">Total Sales / Revenue</label><input class="calc-input" id="revenue" type="number" min="0" step="0.01" placeholder="Example: 50000"><label class="calc-label" id="costLabel" for="cost">Cost of Goods / Purchases</label><input class="calc-input" id="cost" type="number" min="0" step="0.01" placeholder="Example: 25000"><label class="calc-label" id="expenseLabel" for="expenses">Other Expenses</label><input class="calc-input" id="expenses" type="number" min="0" step="0.01" placeholder="Example: 5000"><label class="calc-label" id="businessTypeLabel" for="businessType">Business / Job Type</label><input class="calc-input" id="businessType" type=
